[project]
name = "latent-space-nn-evaluation"
version = "0.1.0"
description = "Metrics and methods for robustness evaluation of neural network image classifiers with generative models."
authors = [{ name = "Igor Buzhinsky", email = "igor.buzhinsky@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    "pillow",
    "tqdm",
    "tensorboardx",
    "h5py",
    "statsmodels",
    "opencv-python (<5)",
    "python-dateutil",
    "lmdb",
    "gdown (>=6.4.2,<7.0.0)",
]

[project.urls]
Paper = "https://link.springer.com/article/10.1007/s10994-021-05994-9"
Preprint = "https://arxiv.org/abs/2003.01993"

[project.optional-dependencies]
# Needed only for the robust ImageNet classifier (AdversarialImageNet.py/.ipynb).
imagenet = ["robustness"]

[dependency-groups]
notebooks = ["jupyter", "ipython"]
dev = [
    "black[jupyter] (>=26.10.1,<27.0.0)",
    "pyrefly (>=1.4.0,<2.0.0)",
    "ruff (>=0.17.2,<0.18.0)"
]

[tool.poetry]
packages = [{ include = "latentspace" }]

[tool.black]
line-length = 120
target-version = ["py311"]
# Vendored third-party code is kept as in upstream.
extend-exclude = "^/(biggan|pioneer)/"

[tool.ruff]
line-length = 120
target-version = "py311"
# Vendored third-party code is kept as in upstream.
extend-exclude = ["biggan", "pioneer"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F",  # pyflakes and basic pycodestyle errors
    "I",  # import sorting
    "UP006", "UP007", "UP035", "UP045",  # modern type hint syntax (PEP 585/604)
    "TID252",  # absolute imports
    "B",  # flake8-bugbear: likely bugs
    "SIM", "RET", "PIE", "C4",  # simplifications
    "PTH",  # pathlib instead of os.path
]
# open() works with Path objects and is idiomatic
ignore = ["PTH123"]

[tool.ruff.lint.flake8-tidy-imports]
# use absolute imports (latentspace.module) instead of relative ones (.module)
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["latentspace"]

[tool.pyrefly]
preset = "default"
project-includes = ["latentspace", "tests", "*.py", "*.ipynb"]
# Vendored third-party code is kept as in upstream.
project-excludes = ["biggan/**", "pioneer/**"]
search-path = [".", "pioneer/src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
