[project]
name = "latent-space-nn-evaluation"
version = "0.1.0"
description = "Metrics and methods for robustness evaluation of neural network image classifiers with generative models."
authors = [{ name = "Igor Buzhinsky", email = "igorbuz@gmail.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    "pillow",
    "tqdm",
    "tensorboardx",
    "h5py",
    "statsmodels",
    "opencv-python (<5)",
    "python-dateutil",
    "lmdb",
]

[project.urls]
Paper = "https://arxiv.org/abs/2003.01993"

[project.optional-dependencies]
# Needed only for the robust ImageNet classifier (AdversarialImageNet.py/.ipynb).
imagenet = ["robustness"]

[dependency-groups]
notebooks = ["jupyter", "ipython"]
dev = [
    "black[jupyter] (>=26.10.1,<27.0.0)",
    "pyrefly (>=1.4.0,<2.0.0)"
]

[tool.poetry]
packages = [{ include = "latentspace" }]

[tool.black]
line-length = 120
target-version = ["py311"]
# Vendored third-party code is kept as in upstream.
extend-exclude = "^/(biggan|pioneer)/"

[tool.pyrefly]
preset = "default"
project-includes = ["latentspace", "*.py", "*.ipynb"]
# Vendored third-party code is kept as in upstream.
project-excludes = ["biggan/**", "pioneer/**"]
search-path = [".", "pioneer/src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
